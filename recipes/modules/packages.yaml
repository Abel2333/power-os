---

modules:
  - type: script
    snippets:
      - "curl -fsSL https://download.docker.com/linux/fedora/docker-ce.repo -o /etc/yum.repos.d/docker-ce.repo"
      # dae is not in Fedora repos; upstream Dae Universe repo is GPG-signed and tracks upstream releases
      - "curl -fsSL https://daeuniverse.pages.dev/daeuniverse.repo -o /etc/yum.repos.d/daeuniverse.repo"

  - type: dnf
    repos:
      copr:
        - yalter/niri
        - alternateved/keyd
        - atim/nushell
        - jdxcode/mise
    install:
      packages:
        # Development
        - gcc
        - gcc-c++
        - make
        - cmake
        - clang
        - clangd
        - ninja
        - perl
        - mise
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

        # Shell prompt

        # Wayland compositor and desktop shell
        - niri
        - mako
        - waybar

        # Terminal emulator
        - kitty

        # Session, lock, and wallpaper
        - swaylock
        - swayidle
        - swaybg
        - swaymsg
        - brightnessctl
        - upower

        # X11 compatibility
        - xwayland-satellite

        # XDG desktop portals
        - xdg-desktop-portal-kde
        - xdg-desktop-portal-gtk

        # Secret storage: gnome-keyring provides org.freedesktop.secrets for
        # Flatpak apps, and pam_gnome_keyring lets plasmalogin unlock the login
        # keyring at sign-in. plasmalogin already ships both hooks in
        # /usr/lib/pam.d/plasmalogin, but they are no-ops without the module.
        - gnome-keyring
        - gnome-keyring-pam

        # Clipboard and audio control
        - wl-clipboard
        - pavucontrol

        # Shell
        - zsh
        - nushell

        # Input method
        - fcitx5
        - fcitx5-rime
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool
        # Optional librime plugins, loaded from /usr/lib64/rime-plugins/ at
        # runtime. 万象拼音 drives its processors and filters from Lua, so
        # librime-lua is mandatory for it; librime-octagram is what loads the
        # .gram grammar model. librime-tools adds rime_deployer, which rebuilds
        # a schema without restarting fcitx5.
        - librime-lua
        - librime-octagram
        - librime-tools

        # Privilege escalation and input remapping
        - polkit-kde
        - keyd

        # AppImage compatibility
        - fuse
        - fuse-libs

        # CLI tools
        - rclone
        - mpd

        # Proxy
        - dae
    remove:
      packages:
        # Browser
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - alacritty

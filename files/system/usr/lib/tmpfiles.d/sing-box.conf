# The runtime config carries subscription credentials and must never be baked
# into the image. This directory is created at boot, after systemd-sysusers has
# created the sing-box group. The setgid bit makes every file written here
# inherit the sing-box group, so a generator using UMask=0027 produces
# 0640 root:sing-box with no extra chmod.
d /etc/sing-box 2750 root sing-box -

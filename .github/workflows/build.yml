name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yaml
    steps:
      # A share link or a subscription URL committed here would publish proxy
      # credentials for the whole world to read. Fail before the build starts.
      # Patterns stay generic on purpose: naming the provider would itself leak.
      - name: Reject credential-shaped strings
        run: |
          set -uo pipefail
          status=0

          # Share links carry credentials in the userinfo part.
          if grep -rInE '(vless|vmess|trojan|hysteria2?|tuic|ss|ssr)://[^[:space:]]*@' \
               --exclude-dir=.git --exclude=Containerfile . ; then
            echo "::error::share link with credentials found above"
            status=1
          fi

          # A URL carrying a query string is how a subscription endpoint looks.
          # Legitimate URLs in this repo (release assets, package repos, DoH) have
          # no query part, so this does not produce false positives today.
          if grep -rInE 'https?://[^[:space:]"'\'']*\?[^[:space:]"'\'']*=' \
               --exclude-dir=.git --exclude=Containerfile . ; then
            echo "::error::URL with a query string found above; subscriptions must not be committed"
            status=1
          fi

          if [ "$status" -eq 0 ]; then echo "no credential-shaped strings found"; fi
          exit "$status"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
